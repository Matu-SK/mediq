<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AuraStudy</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #070b14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      outline: none;
      display: block;
      background-color: #070b14;
    }
    .setup-card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(17, 26, 46, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 24px;
      padding: 32px;
      max-width: 460px;
      width: 90%;
      color: #f8fafc;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      text-align: center;
      z-index: 1000;
    }
    input {
      width: 100%;
      padding: 14px;
      margin: 18px 0;
      border-radius: 14px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      background: rgba(7, 11, 20, 0.8);
      color: #fff;
      font-family: monospace;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #14b8a6; }
    button {
      background: linear-gradient(135deg, #0ea5e9, #10b981);
      color: #fff;
      font-weight: 700;
      padding: 13px 28px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 14px;
      transition: filter 0.2s;
    }
    button:hover { filter: brightness(1.1); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="setupModal" class="setup-card hidden">
    <h2 style="margin: 0 0 8px 0; font-size: 20px;">AuraStudy — Prepojenie</h2>
    <p style="font-size: 12px; color: #94a3b8; margin: 0; line-height: 1.5;">
      Vlož odkaz svojej Google Apps Script webovej aplikácie (končiaci na <code>/exec</code>). Uloží sa do pamäte tohto zariadenia.
    </p>
    <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
    <button onclick="saveAndLaunch()">Spustiť Fullscreen</button>
  </div>

  <iframe id="appFrame" class="hidden" allow="clipboard-read; clipboard-write" allowfullscreen></iframe>

  <script>
    const STORAGE_KEY = 'aurastudy_gas_url_v1';

    function init() {
      const urlParams = new URLSearchParams(window.location.search);
      let targetUrl = urlParams.get('url');

      if (!targetUrl) {
        targetUrl = localStorage.getItem(STORAGE_KEY);
      }

      if (targetUrl && targetUrl.startsWith('https://script.google.com/')) {
        launchFrame(targetUrl);
      } else {
        document.getElementById('setupModal').classList.remove('hidden');
      }
    }

    function saveAndLaunch() {
      const inp = document.getElementById('scriptUrlInput').value.trim();
      if (!inp.startsWith('https://script.google.com/')) {
        alert('Vlož platný odkaz začínajúci na https://script.google.com/macros/s/.../exec');
        return;
      }
      localStorage.setItem(STORAGE_KEY, inp);
      launchFrame(inp);
    }

    function launchFrame(url) {
      document.getElementById('setupModal').classList.add('hidden');
      const frame = document.getElementById('appFrame');
      frame.src = url;
      frame.classList.remove('hidden');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
